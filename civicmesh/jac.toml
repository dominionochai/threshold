[project]
name = "civicmesh"
version = "1.0.0"
entry = "app.jac"

[dependencies.npm]
d3 = "latest"
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
react-hook-form = "^7.71.0"
zod = "^4.3.6"
"@hookform/resolvers" = "^5.2.2"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.2.1"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"

[plugins.byllm.model]
default_model = "featherless_ai/meta-llama/Llama-3.1-8B-Instruct"
temperature = 0.2

# Swapped to Featherless as primary — no NVIDIA NIM key required, just
# FEATHERLESS_API_KEY in .env. Featherless gives flat-rate access to
# 30k+ open-source models under a single API key. (Originally NIM was
# primary with Featherless as fallback; if you get a NIM key later and
# want it back as primary, swap default_model back to
# "nvidia_nim/meta/llama-3.1-8b-instruct" and re-add a fallback_models
# block pointing at Featherless.)

[plugins.byllm.fallback]
strategy = "fallback"
# Fail fast on launch day. With num_retries=1 + timeout=25, a hung LLM
# triggers our walker-level try/except within ~25 s instead of the old
# ~360 s (120s × 3 attempts). The walker fallback then synthesizes a
# deterministic result so the user always gets a response.
num_retries = 1
timeout = 25.0

[plugins.byllm.compaction]
enabled = true
threshold_ratio = 0.8
keep_recent_iterations = 3

[plugins.scale.server]
port = 7860
host = "0.0.0.0"

[plugins.scale.metrics]
enabled = true

[plugins.client]
debug = false

[serve]
base_route_app = "app"
